<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generador · XV Hannia Victoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Italiana&family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --azul-muy-claro:#f2f8fd;
    --azul-claro:#dceaf6;
    --azul:#b9d4ea;
    --azul-medio:#8bb4d4;
    --azul-fuerte:#5e8bb3;
    --azul-bosque:#426d93;
    --azul-oscuro:#2c4e6d;
    --dorado:#c9a86a;
    --dorado-claro:#e6d3a3;
    --dorado-oscuro:#a68649;
    --crema:#faf7f2;
    --tinta:#2c4e6d;
    --sombra:0 10px 40px rgba(66,109,147,.15);
    --sombra-suave:0 4px 20px rgba(66,109,147,.1);
    --sombra-dorada:0 4px 25px rgba(201,168,106,.3);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Montserrat',sans-serif;
    background:
      radial-gradient(ellipse at top, var(--azul-claro) 0%, transparent 60%),
      radial-gradient(ellipse at bottom right, var(--azul) 0%, transparent 60%),
      var(--crema);
    min-height:100vh;color:var(--tinta);
    display:flex;align-items:center;justify-content:center;
    padding:30px 16px;overflow-x:hidden;position:relative;
  }

  /* Partículas de fondo */
  .sparkles-bg{
    position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  }
  .sparkle{
    position:absolute;width:5px;height:5px;background:var(--dorado);
    border-radius:50%;box-shadow:0 0 8px var(--dorado-claro);
    opacity:0;animation: subir 13s linear infinite;
  }
  @keyframes subir{
    0%{transform:translateY(110vh) scale(0);opacity:0}
    10%{opacity:.8}
    90%{opacity:.8}
    100%{transform:translateY(-10vh) scale(1.2);opacity:0}
  }

  .card{
    background:#fff;border-radius:20px;
    box-shadow:var(--sombra);padding:50px 36px 40px;
    max-width:560px;width:100%;
    border:1px solid var(--azul);
    position:relative;overflow:hidden;
    z-index:1;animation:cardEntra .9s ease;
  }
  @keyframes cardEntra{
    from{opacity:0;transform:translateY(30px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg, transparent, var(--dorado), transparent);
  }

  .deco-corner{
    position:absolute;width:140px;height:140px;
    pointer-events:none;opacity:.85;
  }
  .deco-corner.tl{top:-10px;left:-10px}
  .deco-corner.br{bottom:-10px;right:-10px;transform:scale(-1,-1)}

  .header{text-align:center;margin-bottom:30px;position:relative;z-index:2}

  .header-xv{
    position:relative;display:inline-block;margin-bottom:8px;
    animation:zoomIn .9s ease;
  }
  @keyframes zoomIn{
    from{opacity:0;transform:scale(.6)}
    to{opacity:1;transform:scale(1)}
  }
  .header-xv .xv-lg{
    font-family:'Italiana',serif;
    background:linear-gradient(135deg, var(--azul-bosque), var(--azul-fuerte), var(--azul-bosque));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-size:3.6rem;line-height:1;letter-spacing:.15em;
  }
  .header-xv .anos-sm{
    position:absolute;top:54%;left:50%;transform:translate(-50%,-50%);
    font-family:'Great Vibes',cursive;
    color:var(--dorado);font-size:1.6rem;
    text-shadow:-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
  }

  .header h1{
    font-family:'Pinyon Script',cursive;
    color:var(--azul-bosque);font-size:2.8rem;font-weight:400;
    line-height:1;margin-top:6px;
    text-shadow:0 2px 8px rgba(66,109,147,.12);
  }
  .header .sub{
    font-family:'Cormorant Garamond',serif;
    color:var(--dorado);font-size:.85rem;
    letter-spacing:.35em;margin-top:8px;
  }
  .header p.texto{
    margin-top:16px;font-size:.85rem;color:#888;
    font-family:'Cormorant Garamond',serif;font-style:italic;
  }

  .divisor{
    display:flex;align-items:center;justify-content:center;
    gap:12px;color:var(--dorado);margin:14px 0 20px;
  }
  .divisor::before,.divisor::after{
    content:'';height:1px;width:50px;background:var(--dorado);
  }

  label{
    display:block;font-size:.78rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--azul-bosque);
    font-weight:500;margin-bottom:8px;margin-top:20px;
  }
  input, select{
    width:100%;padding:14px 16px;
    border:1px solid var(--azul);border-radius:10px;
    font-family:'Montserrat',sans-serif;font-size:1rem;
    background:var(--azul-muy-claro);transition:all .25s ease;
    color:var(--tinta);
  }
  input:focus, select:focus{
    outline:none;border-color:var(--dorado);
    box-shadow:0 0 0 3px rgba(201,168,106,.2);background:#fff;
  }

  .btn{
    width:100%;margin-top:24px;padding:16px;
    background:var(--azul-bosque);color:#fff;
    border:none;border-radius:50px;cursor:pointer;
    font-family:'Montserrat',sans-serif;font-size:.9rem;
    letter-spacing:.18em;text-transform:uppercase;font-weight:500;
    transition:all .3s;position:relative;overflow:hidden;
  }
  .btn::after{
    content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
    transition:left .6s ease;
  }
  .btn:hover::after{left:100%}
  .btn:hover{background:var(--dorado);transform:translateY(-2px);box-shadow:var(--sombra-dorada)}

  .resultado{
    margin-top:30px;padding:24px 20px;
    background:linear-gradient(135deg,var(--azul-muy-claro) 0%, #fff 100%);
    border:1px dashed var(--azul-bosque);border-radius:14px;
    display:none;position:relative;
  }
  .resultado.show{display:block;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .resultado-titulo{
    font-family:'Cormorant Garamond',serif;
    color:var(--azul-bosque);font-size:1.3rem;margin-bottom:6px;text-align:center;
  }
  .resultado-sub{text-align:center;font-size:.85rem;color:#666;margin-bottom:16px}
  .url-box{
    background:#fff;padding:12px 14px;border-radius:8px;
    border:1px solid var(--azul);font-size:.82rem;word-break:break-all;
    color:var(--tinta);font-family:monospace;max-height:90px;overflow-y:auto;
  }
  .acciones{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;
  }
  .acciones button, .acciones a{
    padding:12px;border-radius:10px;border:none;cursor:pointer;
    font-family:'Montserrat',sans-serif;font-size:.78rem;
    letter-spacing:.12em;text-transform:uppercase;font-weight:500;
    text-decoration:none;text-align:center;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:all .25s;
  }
  .btn-copiar{background:var(--azul-bosque);color:#fff}
  .btn-copiar:hover{background:var(--dorado);transform:translateY(-2px)}
  .btn-wa{background:#25D366;color:#fff}
  .btn-wa:hover{background:#1da851;transform:translateY(-2px)}
  .btn-abrir{
    background:#fff;color:var(--azul-bosque);
    border:1px solid var(--azul-bosque) !important;grid-column:1/-1;
  }
  .btn-abrir:hover{background:var(--azul-bosque);color:#fff}

  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
    background:var(--azul-bosque);color:#fff;padding:12px 24px;
    border-radius:50px;font-size:.85rem;
    box-shadow:var(--sombra);opacity:0;pointer-events:none;
    transition:opacity .3s, transform .3s;z-index:999;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-5px)}

  .config{
    margin-top:24px;padding:14px;background:var(--crema);
    border-radius:10px;font-size:.75rem;color:#888;text-align:center;
  }
  .config strong{color:var(--azul-bosque)}

  .historial{
    margin-top:20px;border-top:1px solid var(--azul);padding-top:20px;
  }
  .historial-titulo{
    font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--azul-bosque);margin-bottom:12px;
  }
  .historial-item{
    background:var(--azul-muy-claro);padding:10px 14px;border-radius:8px;
    margin-bottom:8px;display:flex;justify-content:space-between;
    align-items:center;font-size:.85rem;transition:transform .2s;
  }
  .historial-item:hover{transform:translateX(4px)}
  .historial-item .info strong{color:var(--azul-bosque)}
  .historial-item .info small{color:#888;display:block;margin-top:2px}
  .historial-item .mini{
    background:var(--dorado);color:#fff;border:none;
    padding:6px 10px;border-radius:6px;font-size:.7rem;
    cursor:pointer;letter-spacing:.1em;text-transform:uppercase;
  }
  .historial-item .mini:hover{background:var(--azul-bosque)}
  .historial-vacio{color:#999;font-size:.85rem;text-align:center;font-style:italic}
  .btn-limpiar{
    background:transparent;color:#888;border:none;cursor:pointer;
    font-size:.75rem;margin-top:8px;text-decoration:underline;
  }

  /* ===== RESPONSIVE GENERADOR ===== */

  /* Móvil pequeño */
  @media (max-width:480px){
    body{padding:20px 12px}
    .card{padding:38px 24px 30px;border-radius:16px}
    .deco-corner{width:100px;height:100px}
    .header-xv .xv-lg{font-size:2.8rem}
    .header-xv .anos-sm{font-size:1.3rem}
    .header h1{font-size:2.2rem}
    .header .sub{font-size:.75rem;letter-spacing:.25em}
    .acciones{grid-template-columns:1fr}
    .btn-abrir{grid-column:auto}
    label{font-size:.72rem}
    input, select{padding:12px 14px;font-size:.95rem}
    .url-box{font-size:.75rem;padding:10px 12px}
  }

  /* Tablet */
  @media (min-width:481px) and (max-width:1023px){
    .card{padding:48px 36px 38px}
    .deco-corner{width:130px;height:130px}
  }

  /* Desktop */
  @media (min-width:1024px){
    body{padding:50px 20px}
    .card{
      max-width:620px;
      padding:60px 50px 45px;
      border-radius:22px;
    }
    .deco-corner{width:160px;height:160px}
    .deco-corner.tl{top:-15px;left:-15px}
    .deco-corner.br{bottom:-15px;right:-15px}
    .header-xv .xv-lg{font-size:4rem}
    .header-xv .anos-sm{font-size:1.8rem}
    .header h1{font-size:3.2rem}
    .header .sub{font-size:.95rem}
    .header p.texto{font-size:.95rem}
    label{font-size:.85rem;margin-top:22px}
    input, select{padding:16px 18px;font-size:1.05rem}
    .btn{padding:18px;font-size:.95rem}
    .resultado{padding:30px 26px}
    .resultado-titulo{font-size:1.5rem}
    .url-box{font-size:.88rem;padding:14px 16px;max-height:110px}
    .acciones button, .acciones a{padding:14px;font-size:.82rem}
  }

  /* Pantallas grandes */
  @media (min-width:1440px){
    .card{max-width:680px;padding:70px 60px 50px}
  }
</style>
</head>
<body>

<div class="sparkles-bg" id="sparklesBg"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bouquet-mini" viewBox="0 0 200 200">
      <g opacity="0.75">
        <ellipse cx="20" cy="45" rx="22" ry="9" transform="rotate(-25 20 45)" fill="#b9d4ea"/>
        <ellipse cx="150" cy="25" rx="25" ry="10" transform="rotate(25 150 25)" fill="#b9d4ea"/>
        <ellipse cx="175" cy="85" rx="20" ry="8" transform="rotate(60 175 85)" fill="#8bb4d4"/>
        <ellipse cx="35" cy="165" rx="22" ry="9" transform="rotate(-45 35 165)" fill="#8bb4d4"/>
        <ellipse cx="165" cy="170" rx="22" ry="9" transform="rotate(45 165 170)" fill="#b9d4ea"/>
      </g>
      <g fill="none" stroke="#c9a86a" stroke-width="1" opacity="0.6">
        <path d="M25 80 Q50 75 75 90" stroke-linecap="round"/>
        <path d="M130 55 Q155 50 175 70" stroke-linecap="round"/>
      </g>
      <g transform="translate(85, 95)">
        <g fill="#426d93">
          <ellipse cx="0" cy="-17" rx="12" ry="18"/>
          <ellipse cx="16" cy="-5" rx="12" ry="18" transform="rotate(72 16 -5)"/>
          <ellipse cx="10" cy="13" rx="12" ry="18" transform="rotate(144 10 13)"/>
          <ellipse cx="-10" cy="13" rx="12" ry="18" transform="rotate(216 -10 13)"/>
          <ellipse cx="-16" cy="-5" rx="12" ry="18" transform="rotate(288 -16 -5)"/>
        </g>
        <circle r="14" fill="#5e8bb3"/>
        <circle r="8" fill="#8bb4d4"/>
        <circle r="4" fill="#b9d4ea"/>
        <circle r="2" fill="#dceaf6"/>
      </g>
      <g transform="translate(130, 135)">
        <g fill="#fdfcf9" stroke="#dceaf6" stroke-width="0.5">
          <ellipse cx="0" cy="-10" rx="8" ry="11"/>
          <ellipse cx="9" cy="-3" rx="8" ry="11" transform="rotate(72)"/>
          <ellipse cx="6" cy="9" rx="8" ry="11" transform="rotate(144)"/>
          <ellipse cx="-6" cy="9" rx="8" ry="11" transform="rotate(216)"/>
          <ellipse cx="-9" cy="-3" rx="8" ry="11" transform="rotate(288)"/>
        </g>
        <circle r="4" fill="#c9a86a"/>
        <circle r="2" fill="#a68649"/>
      </g>
      <g fill="#ffffff" opacity="0.95">
        <circle cx="50" cy="110" r="2.5"/>
        <circle cx="60" cy="120" r="2"/>
        <circle cx="45" cy="125" r="2"/>
        <circle cx="160" cy="55" r="2.3"/>
        <circle cx="170" cy="65" r="1.8"/>
      </g>
      <g fill="#8bb4d4" opacity="0.8">
        <circle cx="50" cy="110" r=".9"/>
        <circle cx="160" cy="55" r=".8"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="card">

  <div class="deco-corner tl"><svg width="100%" height="100%"><use href="#bouquet-mini"/></svg></div>
  <div class="deco-corner br"><svg width="100%" height="100%"><use href="#bouquet-mini"/></svg></div>

  <div class="header">
    <div class="header-xv">
      <div class="xv-lg">XV</div>
      <div class="anos-sm">Años</div>
    </div>
    <h1>Hannia Victoria</h1>
    <div class="sub">ROMERO BARRA</div>
    <div class="divisor"><span>✦</span></div>
    <p class="texto">Generador de invitaciones personalizadas</p>
  </div>

  <label for="nombre">Nombre del invitado</label>
  <input type="text" id="nombre" placeholder="Ej. Familia Martínez" autocomplete="off" />

  <label for="pases">Número de pases</label>
  <select id="pases">
    <option value="1">1 pase</option>
    <option value="2" selected>2 pases</option>
    <option value="3">3 pases</option>
    <option value="4">4 pases</option>
    <option value="5">5 pases</option>
    <option value="6">6 pases</option>
    <option value="7">7 pases</option>
    <option value="8">8 pases</option>
    <option value="10">10 pases</option>
  </select>

  <button class="btn" id="btnGenerar">Generar Invitación</button>

  <div class="resultado" id="resultado">
    <p class="resultado-titulo">✨ ¡Invitación lista!</p>
    <p class="resultado-sub" id="resumen">—</p>
    <div class="url-box" id="urlBox">—</div>
    <div class="acciones">
      <button class="btn-copiar" id="btnCopiar">📋 Copiar link</button>
      <a class="btn-wa" id="btnWA" target="_blank" rel="noopener">💬 WhatsApp</a>
      <a class="btn-abrir" id="btnAbrir" target="_blank" rel="noopener">👁️ Previsualizar</a>
    </div>
  </div>

  <div class="historial">
    <div class="historial-titulo">Últimas invitaciones generadas</div>
    <div id="historial"></div>
    <button class="btn-limpiar" id="btnLimpiar">Limpiar historial</button>
  </div>

  <div class="config">
    <strong>URL base de la invitación:</strong>
    <div id="baseUrl" style="margin-top:4px;word-break:break-all"></div>
  </div>
</div>

<div class="toast" id="toast">Copiado ✓</div>

<script>
  const URL_BASE = window.location.href.replace(/generar\.html.*$/, 'index.html');
  const WHATSAPP_NUM = '522217445410';

  document.getElementById('baseUrl').textContent = URL_BASE;

  /* Partículas */
  const sparklesBg = document.getElementById('sparklesBg');
  function crearSparkle(){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (Math.random() * 8 + 8) + 's';
    s.style.animationDelay = Math.random() * 2 + 's';
    s.style.opacity = Math.random() * .5 + .3;
    const size = Math.random() * 4 + 3;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    sparklesBg.appendChild(s);
    setTimeout(()=>s.remove(), 18000);
  }
  setInterval(crearSparkle, 700);
  for (let i = 0; i < 12; i++) setTimeout(crearSparkle, i * 250);

  const $nombre = document.getElementById('nombre');
  const $pases = document.getElementById('pases');
  const $resultado = document.getElementById('resultado');
  const $urlBox = document.getElementById('urlBox');
  const $resumen = document.getElementById('resumen');
  const $toast = document.getElementById('toast');
  const $btnGenerar = document.getElementById('btnGenerar');
  const $btnCopiar = document.getElementById('btnCopiar');
  const $btnWA = document.getElementById('btnWA');
  const $btnAbrir = document.getElementById('btnAbrir');
  const $historial = document.getElementById('historial');
  const $btnLimpiar = document.getElementById('btnLimpiar');

  let historial = [];

  function mostrarToast(msg){
    $toast.textContent = msg;
    $toast.classList.add('show');
    setTimeout(()=>$toast.classList.remove('show'), 2000);
  }

  function generarUrl(nombre, pases){
    const nombreLimpio = encodeURIComponent(nombre.trim());
    return `${URL_BASE}?invitado=${nombreLimpio}&pases=${pases}`;
  }

  function mensajeWhatsapp(nombre, pases, url){
    const txt =
`💙 *¡Estás invitado(a) a mis XV Años!* 💙

Con mucha emoción *Hannia Victoria* te invita a celebrar este día tan especial.

👤 *Invitado(a):* ${nombre}
🎟️ *Pases:* ${pases}
📅 *Fecha:* 5 de junio de 2026

Consulta todos los detalles aquí 👇
${url}

¡Te esperamos!`;
    return encodeURIComponent(txt);
  }

  function renderHistorial(){
    if (historial.length === 0){
      $historial.innerHTML = '<p class="historial-vacio">Aún no has generado invitaciones en esta sesión.</p>';
      return;
    }
    $historial.innerHTML = historial.slice().reverse().map(h => `
      <div class="historial-item">
        <div class="info">
          <strong>${h.nombre}</strong>
          <small>${h.pases} ${h.pases==1?'pase':'pases'} · ${h.hora}</small>
        </div>
        <button class="mini" data-url="${h.url}">Copiar</button>
      </div>
    `).join('');

    $historial.querySelectorAll('.mini').forEach(btn => {
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(btn.dataset.url).then(()=>{
          mostrarToast('Link copiado ✓');
        });
      });
    });
  }

  $btnGenerar.addEventListener('click', () => {
    const nombre = $nombre.value.trim();
    const pases = parseInt($pases.value, 10);

    if (!nombre){
      $nombre.focus();
      $nombre.style.borderColor = '#d9534f';
      mostrarToast('Escribe el nombre del invitado');
      setTimeout(()=> $nombre.style.borderColor = '', 2000);
      return;
    }

    const url = generarUrl(nombre, pases);
    const waUrl = `https://wa.me/?text=${mensajeWhatsapp(nombre, pases, url)}`;

    $urlBox.textContent = url;
    $resumen.textContent = `Para ${nombre} · ${pases} ${pases==1?'pase':'pases'}`;
    $btnWA.href = waUrl;
    $btnAbrir.href = url;
    $resultado.classList.add('show');

    const ahora = new Date();
    const hora = ahora.toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
    historial.push({ nombre, pases, url, hora });
    renderHistorial();

    setTimeout(()=> $resultado.scrollIntoView({behavior:'smooth', block:'center'}), 100);
  });

  $btnCopiar.addEventListener('click', () => {
    navigator.clipboard.writeText($urlBox.textContent).then(()=>{
      mostrarToast('Link copiado ✓');
    }).catch(()=>{
      const range = document.createRange();
      range.selectNode($urlBox);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      mostrarToast('Link copiado ✓');
    });
  });

  $btnLimpiar.addEventListener('click', () => {
    historial = [];
    renderHistorial();
    mostrarToast('Historial limpiado');
  });

  $nombre.addEventListener('keydown', e => {
    if (e.key === 'Enter') $btnGenerar.click();
  });

  renderHistorial();
  $nombre.focus();
</script>

</body>
</html>
